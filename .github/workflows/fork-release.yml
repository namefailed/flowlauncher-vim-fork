# Fork-only release pipeline.
#
# Builds the Vim Edition fork and publishes the installer + portable zip to a
# GitHub Release so the latest build is downloadable without a login.
#
# This workflow lives only on the fork's `dev` branch and is NOT part of the
# upstream PR (#4541). Trigger it manually ("Run workflow") or by pushing a
# tag like `v1.20.2`.

name: Fork Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version (X.Y.Z) for this fork build"
        required: true
        default: "1.20.2"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      NUGET_CERT_REVOCATION_MODE: offline
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${GITHUB_REF_NAME#v}"          # tag v1.20.2 -> 1.20.2
            TAG="${GITHUB_REF_NAME}"
          else
            RAW="${{ github.event.inputs.version }}"
            TAG="v${RAW}.${{ github.run_number }}"
          fi
          echo "tag=${TAG}"                       >> "$GITHUB_OUTPUT"
          echo "assembly=${RAW}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # post_build.ps1 reads $env:flowVersion (case-insensitive on Windows)
          echo "flowVersion=${RAW}"               >> "$GITHUB_ENV"

      - name: Set assembly version
        uses: vers-one/dotnet-project-version-updater@v1.8
        with:
          file: |
            "**/SolutionAssemblyInfo.cs"
          version: ${{ steps.ver.outputs.assembly }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Restore dependencies
        run: nuget restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Package installer + portable
        shell: powershell
        run: .\Scripts\post_build.ps1

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exe=$(ls Output/Packages/Flow-Launcher-*.exe | head -n1)
          if [ -z "$exe" ]; then echo "Installer not found in Output/Packages"; exit 1; fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            "$exe" \
            "Output/Packages/Flow-Launcher-Portable.zip" \
            --title "Vim Edition ${{ steps.ver.outputs.tag }}" \
            --notes "Automated interim build of the Vim Edition fork, published while the upstream review is pending. Enable it in Settings > General > 'Enable Advanced Vim Mode'. The Vim feature is proposed upstream in Flow-Launcher/Flow.Launcher#4541. This is an unsigned build, so Windows SmartScreen may warn -- choose More info > Run anyway if you trust it." \
            --target "$GITHUB_SHA" \
            --prerelease
